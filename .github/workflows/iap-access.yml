name: Access IAP via Workforce Identity

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  access:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUDIENCE: //iam.googleapis.com/locations/global/workforcePools/${{ vars.POOL_ID }}/providers/${{ vars.PROVIDER_ID }}
    steps:
      - name: Get OIDC Token
        id: oidc
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" | jq -r '.value')
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Exchange for STS Token
        id: sts
        run: |
          RESPONSE=$(curl -sS -X POST "https://sts.googleapis.com/v1/token" \
            -H "Content-Type: application/json" \
            -d '{
              "grantType": "urn:ietf:params:oauth:grant-type:token-exchange",
              "audience": "'"$AUDIENCE"'",
              "scope": "https://www.googleapis.com/auth/cloud-platform",
              "requestedTokenType": "urn:ietf:params:oauth:token-type:access_token",
              "subjectToken": "'"${{ steps.oidc.outputs.token }}"'",
              "subjectTokenType": "urn:ietf:params:oauth:token-type:jwt"
            }')
          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
          if [ "$ACCESS_TOKEN" = "null" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "Failed to get access token:"
            echo "$RESPONSE" | jq .
            exit 1
          fi
          echo "token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Generate ID Token for IAP
        id: iap_token
        run: |
          RESPONSE=$(curl -sS -X POST \
            "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/${{ vars.SERVICE_ACCOUNT_EMAIL }}:generateIdToken" \
            -H "Authorization: Bearer ${{ steps.sts.outputs.token }}" \
            -H "Content-Type: application/json" \
            -d '{
              "audience": "'"${{ vars.IAP_CLIENT_ID }}"'",
              "includeEmail": true
            }')
          ID_TOKEN=$(echo "$RESPONSE" | jq -r '.token')
          if [ "$ID_TOKEN" = "null" ] || [ -z "$ID_TOKEN" ]; then
            echo "Failed to generate ID token:"
            echo "$RESPONSE" | jq .
            exit 1
          fi
          echo "token=$ID_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Access IAP-protected service
        run: |
          RESPONSE=$(curl -sS -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ steps.iap_token.outputs.token }}" \
            "https://${{ vars.DOMAIN }}/")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP Status: $HTTP_CODE"
          echo "Response Body:"
          echo "$BODY"
          if [ "$HTTP_CODE" -ge 400 ]; then
            exit 1
          fi
